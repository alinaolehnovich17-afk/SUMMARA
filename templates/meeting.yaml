name: meeting
description: Встреча, совещание или переговоры — планирование предстоящей встречи или итоги состоявшейся
trigger_keywords: [встреча, совещание, обсуждали, договорились, итоги, решили, переговоры, провести встречу, организовать встречу, запланировать встречу, созвон, собрание]
output_template: |
  ## Итоги встречи: {{ title }}
  **Дата:** {{ date if date else "не указана" }}
  **Участники:** {{ participants | join(", ") if participants else "не указаны" }}

  **Решения:**
  {% for item in decisions %}- {{ item }}
  {% endfor %}
  **Следующие шаги:**
  {% for item in next_steps %}- {{ item }}
  {% endfor %}
